name: Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: true
        default: 0.2.1
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:INPUT_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version.' }
          "version=$env:INPUT_VERSION" >> $env:GITHUB_OUTPUT
          "RELEASE_VERSION=$env:INPUT_VERSION" >> $env:GITHUB_ENV
      - name: Verify and build application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run db:generate
          npm run build --workspace=@crm/contracts
          npm run typecheck
          npm run test
          npm run build --workspace=@crm/api
          npm run build --workspace=@crm/web
          powershell.exe -NoProfile -File infrastructure/windows/installer/Test-Phase7.ps1
          powershell.exe -NoProfile -File infrastructure/windows/installer/Test-WindowsRuntime.ps1
          npm exec --workspace=@crm/desktop -- tauri build --no-bundle
      - name: Prepare runtime only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $payload = Join-Path $env:RUNNER_TEMP "caracola-$env:RELEASE_VERSION"
          ./infrastructure/windows/release/New-CrmPayload.ps1 -Destination $payload
          Invoke-WebRequest 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe' -OutFile "$payload\tools\WinSW-x64.exe"
          Invoke-WebRequest 'https://github.com/restic/restic/releases/download/v0.17.3/restic_0.17.3_windows_amd64.zip' -OutFile "$env:RUNNER_TEMP\restic.zip"
          Expand-Archive "$env:RUNNER_TEMP\restic.zip" "$env:RUNNER_TEMP\restic"
          Copy-Item "$env:RUNNER_TEMP\restic\restic_0.17.3_windows_amd64.exe" "$payload\tools\restic.exe"
          $pgUrl = 'https://get.enterprisedb.com/postgresql/postgresql-17.11-1-windows-x64.exe'
          $pgInstaller = Join-Path $env:RUNNER_TEMP 'postgresql.exe'
          Invoke-WebRequest $pgUrl -OutFile $pgInstaller
          if ((Get-AuthenticodeSignature $pgInstaller).Status -ne 'Valid') { throw 'PostgreSQL signature is invalid.' }
          $hash = (Get-FileHash $pgInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ url = $pgUrl; sha256 = $hash; localFile = 'tools/postgresql.exe' } |
            ConvertTo-Json | Set-Content "$payload\infrastructure\windows\config\postgres-source.json" -Encoding utf8
          ./infrastructure/windows/release/New-CrmReleaseManifest.ps1 -PayloadPath $payload -Version $env:RELEASE_VERSION
          "PAYLOAD=$payload" >> $env:GITHUB_ENV
          "PGINSTALLER=$pgInstaller" >> $env:GITHUB_ENV
      - name: Compile single installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          choco install nsis -y --no-progress
          $desktop = (Resolve-Path 'apps/desktop/src-tauri/target/release/crm-local-de-ropa.exe').Path
          $output = Join-Path $env:GITHUB_WORKSPACE "Caracola-Setup-$env:RELEASE_VERSION.exe"
          & 'C:\Program Files (x86)\NSIS\makensis.exe' "/DPRODUCT_VERSION=$env:RELEASE_VERSION" "/DOUTFILE=$output" "/DDESKTOPEXE=$desktop" "/DPAYLOAD=$env:PAYLOAD" "/DPGINSTALLER=$env:PGINSTALLER" 'infrastructure/windows/installer/packaging/Caracola-Setup.nsi'
          if ($env:CERTIFICATE_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
              $sign = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse |
                Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
              & $sign.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:CERTIFICATE_PASSWORD $output
            } finally { Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue }
          }
          $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $output -Leaf)" | Set-Content "$output.sha256"
          Write-Host "Installer bytes: $((Get-Item $output).Length)"
      - uses: actions/upload-artifact@v4
        with:
          name: Caracola-${{ inputs.version }}
          compression-level: 0
          path: |
            Caracola-Setup-*.exe
            Caracola-Setup-*.exe.sha256
          if-no-files-found: error
  smoke-install:
    needs: verify-and-package
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Caracola-${{ needs.verify-and-package.outputs.version }}
          path: installer
      - name: Install, initialize and restart on clean Windows
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem installer -Filter 'Caracola-Setup-*.exe' | Select-Object -First 1
          ./infrastructure/windows/installer/Test-InstalledCaracola.ps1 -InstallerPath $setup.FullName
      - name: Preserve installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Caracola-installation-diagnostics
          path: |
            C:\ProgramData\Caracola\setup.log
            C:\ProgramData\Caracola\install-*.log
            C:\ProgramData\Caracola\install-success.json
            C:\ProgramData\Caracola\test-result.json
            C:\ProgramData\Caracola\logs\*.log
          if-no-files-found: ignore
